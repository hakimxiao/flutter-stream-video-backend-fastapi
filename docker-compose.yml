services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_streamvideo_container
    ports:
      - "8000:8000"
    image: fastapi_streamvideo_app
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - ./:/app
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: postgresdb_streamvideo
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7-alpine
    container_name: streamvideo_redis
    restart: unless-stopped

volumes:
  postgres_data:

